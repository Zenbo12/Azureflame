<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Azure Flame</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="af-style">
/* Layout: sticky command bar over one centered stage (max 1240px). The tactics board is the hero; sections stack below on one rhythm; admin is a two-pane workbench. */
:root{
  --bg:#04070D;
  --surface:#0A1222;
  --surface-2:#0E192E;
  --well:#060B16;
  --line:#16233B;
  --line-2:#22365C;
  --fg:#E7EEF9;
  --muted:#8E9FBD;
  --dim:#5F7194;
  --azure:#2F8CFF;
  --azure-deep:#1A55C9;
  --flame:#7FD3FF;
  --core:#E6F6FF;
  --ink:#03101F;
  --win:#45D99A;
  --loss:#FF6079;
  --draw:#9DABC5;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
  --max:1240px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --tok-s:1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#05080F}
.wrap{width:100%;max-width:calc(var(--max) + 64px);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;text-transform:uppercase}
p{margin:0}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dimtxt{color:var(--dim);font-size:13px}
.ico{width:18px;height:18px;flex:none}
.ico.sm{width:15px;height:15px}
.ico.big{width:30px;height:30px;color:var(--dim)}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--flame);display:inline-flex;align-items:center;gap:10px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--flame);box-shadow:0 0 12px var(--flame);animation:pulse 2.2s ease-in-out infinite}
.h-page{font-size:clamp(42px,6.4vw,76px)}
.lede{color:var(--muted);max-width:62ch;font-size:17px}
.only-edit{display:none!important}
.can-edit .only-edit{display:inline-flex!important}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(5,8,15,.86);-webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);background:none;border:0;padding:4px 0;cursor:pointer}
.brand-name{font-family:var(--display);font-weight:900;font-size:25px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand-name span{color:var(--flame)}
.logo-core{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.6s ease-in-out infinite}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{appearance:none;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:600 15px/1 var(--body);letter-spacing:.02em;padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav .nav-admin{color:var(--flame)}
@media (max-width:720px){.topbar-in{gap:6px;padding-block:10px 6px}.nav{margin-left:0;width:100%}.nav button{padding:9px 12px;font-size:14px}}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:700 15px/1 var(--body);letter-spacing:.02em;color:var(--ink);background:linear-gradient(180deg,var(--flame),var(--azure));box-shadow:0 8px 24px -10px rgba(47,140,255,.85),inset 0 1px 0 rgba(255,255,255,.45);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(47,140,255,.95),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(0)}
.btn.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--azure);background:rgba(47,140,255,.08)}
.btn.btn-sm{padding:8px 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link-btn{appearance:none;background:none;border:0;color:var(--flame);font:600 14px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 0}
.link-btn:hover{color:var(--core)}
.mini{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--body);padding:8px 10px;border-radius:8px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line-2);transition:color .15s,background .15s}
.mini:hover{color:var(--fg);background:var(--surface-2)}
.mini[disabled]{opacity:.35;cursor:not-allowed}
.mini.danger{color:var(--loss)}
.mini.confirm{background:var(--loss);color:#1A0207;box-shadow:none}
.mini.icon{padding:7px}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:52px 40px;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(42% 60% at 78% 42%,rgba(47,140,255,.22),transparent 70%),radial-gradient(28% 40% at 6% 8%,rgba(127,211,255,.09),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
.hero-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(127,178,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(127,178,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(70% 80% at 60% 40%,#000,transparent);mask-image:radial-gradient(70% 80% at 60% 40%,#000,transparent)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.hero-title{font-size:clamp(68px,9.6vw,150px);font-weight:900;line-height:.84;letter-spacing:0;display:flex;flex-direction:column;margin-block:18px 22px}
.ht-b{background:linear-gradient(100deg,var(--azure-deep) 0%,var(--azure) 28%,var(--flame) 52%,var(--core) 62%,var(--flame) 72%,var(--azure) 92%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:burn 9s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px rgba(47,140,255,.35))}
.tagline{font-size:21px;color:var(--muted);max-width:30ch;font-weight:500;line-height:1.4}
.about{color:var(--muted);max-width:52ch;margin-top:14px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-board{margin:0;min-width:0}
.board-cap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:15px}
.cap-k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}
.board-cap strong{color:var(--fg);font-weight:700}
.cap-note{min-width:0}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:28px}.hero{padding-block:34px 28px}}

.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:44px 0 0;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px;padding:18px 20px 0 0;min-width:0}
.stat+.stat{padding-left:22px;border-left:1px solid var(--line)}
.stat dt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat dd{margin:0}
.stat-v{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){margin-top:14px;border-top:1px solid var(--line)}.stat-v{font-size:36px}}

/* sections */
.page-head{padding-block:48px 26px;display:flex;flex-direction:column;gap:10px}
.sec-pad{padding-bottom:72px}
.band{padding-block:56px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.band-roster{padding-block:36px 72px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:36px;margin-top:6px}
@media (max-width:900px){.band{grid-template-columns:minmax(0,1fr);gap:40px}}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:30px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--muted);background:linear-gradient(180deg,rgba(14,25,46,.45),transparent)}
.empty h3{font-size:26px;color:var(--fg)}
.empty-sm{color:var(--dim);font-size:14px;padding:14px 0}

/* board */
.board-frame{position:relative;border-radius:22px;background:#03060C;box-shadow:0 0 0 1px var(--line-2),0 30px 80px -40px rgba(47,140,255,.65);overflow:hidden}
.board-host{width:100%;max-width:100%;aspect-ratio:1088/688}
.board-host svg{display:block;width:100%;height:100%}
.badge-step{position:absolute;left:14px;top:12px;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(4,8,16,.82);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--flame);pointer-events:none}
.pitch .tok-in{transform-box:fill-box;transform-origin:center;transform:scale(var(--tok-s))}
.pitch .tok-label{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.03em;pointer-events:none;user-select:none}
.pitch .tok.h .tok-body{stroke:#D6EEFF;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(47,140,255,.55))}
.pitch .tok.a .tok-body{stroke:#9FB2D3;stroke-width:2.5}
.pitch .tok.h .tok-label{fill:var(--ink)}
.pitch .tok.a .tok-label{fill:#DCE6F5}
.pitch .tok-ring{fill:none;stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pitch .tok.h .tok-ring{stroke:var(--flame)}
.pitch .tok.a .tok-ring{stroke:#AFC0DC}
.pitch .tok.moving .tok-ring{animation:ring 1.1s ease-out infinite}
.pitch .run{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 9;animation:march 1.1s linear infinite}
.pitch .run.h{stroke:#5FB0FF}
.pitch .run.a{stroke:#9FB2D3;stroke-opacity:.7}
.pitch .pass{fill:none;stroke:var(--core);stroke-width:3.5;stroke-linecap:round}
.pitch .pass-glow{fill:none;stroke:var(--flame);stroke-width:13;stroke-linecap:round;stroke-opacity:.28;animation:glowp 1.6s ease-in-out infinite}
.pitch .dribble{fill:none;stroke:var(--core);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1 8;animation:march 1.1s linear infinite}
.pitch .l-arrows{transition:opacity .25s}
.pitch .l-arrows.is-hold{opacity:.6}
.pitch .ghost{fill:none;stroke-width:2.5;stroke-dasharray:4 5;pointer-events:none}
.pitch .ghost.h{stroke:#5FB0FF;stroke-opacity:.6}
.pitch .ghost.a{stroke:#9FB2D3;stroke-opacity:.45}
.pitch .ghost.b{stroke:var(--core);stroke-opacity:.6}
.pitch.editing{touch-action:none}
.pitch.editing .tok,.pitch.editing .ball{cursor:grab}
.pitch.editing .tok.drag,.pitch.editing .ball.drag{cursor:grabbing}
.pitch.editing .tok:focus,.pitch.editing .ball:focus{outline:none}
.pitch.editing .tok:focus-visible .tok-ring,.pitch.editing .tok.drag .tok-ring{opacity:1;animation:none}
.pitch.editing .ball:focus-visible .ball-core{stroke:var(--flame);stroke-width:4}
@media (max-width:600px){:root{--tok-s:1.3}}

/* playbook */
.plays-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-bottom:72px}
.stage{min-width:0}
.stage-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.stage-head h3{font-size:clamp(32px,4.2vw,48px)}
.stage-head .desc{color:var(--muted);max-width:68ch}
.stage-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:6px;color:var(--flame);background:rgba(127,211,255,.08);box-shadow:inset 0 0 0 1px rgba(127,211,255,.24)}
.tag.demo{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.stage-cap{display:flex;gap:12px;align-items:baseline;margin-top:14px;min-height:28px;font-size:16px}
.stage-cap .cap-note{color:var(--fg)}
.controls{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn{appearance:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,transform .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.main{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,var(--flame),var(--azure));color:var(--ink);box-shadow:0 6px 20px -8px rgba(47,140,255,.9)}
.icon-btn.main:hover{transform:scale(1.05)}
.scrub{position:relative;flex:1 1 200px;min-width:150px;height:36px;display:flex;align-items:center}
.scrub input{width:100%}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none}
.ticks i{position:absolute;top:-6px;width:2px;height:12px;background:var(--surface);border-radius:2px;transform:translateX(-1px)}
.time{font-size:12.5px;color:var(--muted);min-width:92px;text-align:right}
.ctl-group{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 12px/1 var(--mono);padding:7px 9px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--flame);box-shadow:inset 0 0 0 1px var(--line-2)}
.toggle{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--muted);cursor:pointer;text-transform:none;letter-spacing:0}
.toggle input{accent-color:var(--azure);width:16px;height:16px;margin:0}
.legend{list-style:none;margin:14px 0 0;padding:0;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend li{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.lg-h{background:var(--azure);box-shadow:0 0 0 2px #D6EEFF inset}
.lg-a{background:#121B2C;box-shadow:0 0 0 2px #9FB2D3 inset}
.legend .lg-b{width:22px;height:3px;border-radius:2px;background:var(--core);box-shadow:0 0 8px var(--flame)}
.legend .lg-r{width:22px;height:0;border-radius:0;border-top:3px dashed #5FB0FF}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:4px}
.steps button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:baseline;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font:500 15px/1.45 var(--body);transition:background .2s,color .2s}
.steps button:hover{background:var(--surface);color:var(--fg)}
.steps .n{font:700 13px var(--mono);color:var(--dim)}
.steps li.on button{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.steps li.on .n{color:var(--flame)}
.library{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 108px);display:flex;flex-direction:column;gap:14px;min-width:0}
.lib-tools{display:flex;flex-direction:column;gap:10px}
.lib-list{list-style:none;margin:0;padding:2px 4px 2px 2px;overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.lib-item{width:100%;display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:10px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);cursor:pointer;transition:box-shadow .2s,background .2s,transform .25s var(--ease)}
.lib-item:hover{box-shadow:inset 0 0 0 1px var(--line-2);transform:translateX(2px)}
.lib-item[aria-current="true"]{background:linear-gradient(90deg,rgba(47,140,255,.16),var(--surface) 75%);box-shadow:inset 0 0 0 1.5px var(--azure)}
.lib-thumb{display:block;border-radius:8px;overflow:hidden;background:var(--well)}
.lib-thumb svg,.adm-thumb svg{display:block;width:100%;height:auto}
.lib-meta{min-width:0}
.lib-cat{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--flame)}
.lib-name{display:block;font-weight:700;font-size:15.5px;line-height:1.25;margin-top:6px}
.lib-sub{display:block;font-size:12.5px;color:var(--dim);margin-top:4px}
@media (max-width:980px){.plays-layout{grid-template-columns:minmax(0,1fr)}.library{position:static;max-height:none}.lib-list{overflow:visible;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}

/* chips + inputs */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);font:600 12.5px/1 var(--body);padding:8px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--azure);color:var(--ink);box-shadow:none}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;min-width:0;background:var(--well);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font:500 15px/1.35 var(--body);transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px rgba(47,140,255,.22)}
input[disabled]{opacity:.45}
textarea{resize:vertical;min-height:88px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--azure) var(--p,0%),var(--line-2) var(--p,0%));margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--core);box-shadow:0 0 0 4px rgba(47,140,255,.35),0 0 14px rgba(127,211,255,.8)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--core);box-shadow:0 0 0 4px rgba(47,140,255,.35),0 0 14px rgba(127,211,255,.8)}
input[type=range]::-moz-range-track{background:transparent}
input[type=range]:focus{box-shadow:none}
input[type=range]:focus-visible{outline:2px solid var(--flame);outline-offset:6px}

/* ---------- toasts, veil ---------- */
function toast(msg, kind) {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, kind === 'err' ? 6000 : 3200);
}

/* ---------- saving: republish this page with the changed data ---------- */
function stash(extra) { store.set('af-stash', JSON.stringify(Object.assign({ at: Date.now(), view: S.view, adminTab: S.adminTab, playId: S.playId }, extra))); }
async function commit(mutate, okMsg, after) {
  if (S.saving) return;
  if (!S.artifact) { toast(ERR.unavailable, 'err'); return; }
  if (SRC_APP.length < 2000 || SRC_STYLE.length < 500) { toast(ERR.invalid, 'err'); return; }
  const next = normalize(clone(DATA));
  mutate(next);
  const html = buildDocument(next);
  S.saving = true;
  veil(true);
  stash({ toast: okMsg, kind: 'ok' });
  for (let attempt = 0; ; attempt++) {
    try {
      await S.artifact.publish(html);
      DATA = next;
      if (after) after();
      setTimeout(() => { store.del('af-stash'); S.saving = false; veil(false); renderNav(); renderMain(); renderFooter(); toast(okMsg, 'ok'); }, 2500);
      return;
    } catch (err) {
      const code = (err && err.code) || 'upstream_error';
      if (code === 'upstream_error' && attempt === 0) { await sleep(500 + Math.random() * 700); continue; }
      S.saving = false;
      veil(false);
      if (code === 'conflict') { stash({ toast: ERR.conflict, kind: 'err', draft: S.draft ? clone(S.draft) : null }); toast(ERR.conflict, 'err'); return; }
      store.del('af-stash');
      if (['not_writer', 'not_granted', 'consent_required'].includes(code)) { S.canEdit = false; toast(ERR.readonly, 'err'); renderNav(); renderMain(); return; }
      if (['capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { toast(ERR.unavailable, 'err'); return; }
      if (code === 'too_large') return toast(ERR.too_large, 'err');
      if (code === 'rate_limited') return toast(ERR.rate_limited, 'err');
      if (code === 'invalid_content' || code === 'transform_error') return toast(ERR.invalid, 'err');
      return toast(ERR.upstream, 'err');
    }
  }
}
function moveItem(key, id, dir, msg) {
  commit(n => { const a = n[key], i = a.findIndex(x => x.id === id), j = i + dir; if (i < 0 || j < 0 || j >= a.length) return; const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }, msg);
}
function confirmClick(btn, fn) {
  if (btn.classList.contains('confirm')) { clearTimeout(btn._t); fn(); return; }
  btn.classList.add('confirm');
  btn._orig = btn.innerHTML;
  btn.textContent = 'Wirklich löschen?';
  btn._t = setTimeout(() => { btn.classList.remove('confirm'); btn.innerHTML = btn._orig; }, 3500);
}
function markErr(fid) { const f = document.getElementById(fid); if (!f) return; f.classList.add('err'); const m = $('.err-msg', f); if (m) m.hidden = false; const i = $('input,textarea', f); if (i) i.focus(); }

/* ---------- images ---------- */
async function processImage(file) {
  if (!file || !/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) throw new Error('type');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const s = Math.min(1, 720 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let q = 0.86, out = c.toDataURL('image/webp', q);
    if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
    while (out.startsWith('data:image/webp') && out.length > 420000 && q > 0.45) { q -= 0.12; out = c.toDataURL('image/webp', q); }
    if (out.length > 900000) out = c.toDataURL('image/jpeg', 0.8);
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function handleImg(file) {
  try {
    const data = await processImage(file);
    S.pendingImg = data;
    const prev = $('#fr-prev'), clr = $('#fr-clear');
    if (prev) prev.innerHTML = `<img src="${data}" alt="Vorschau der Playercard">`;
    if (clr) clr.hidden = false;
  } catch (e) { toast('Dieses Bild kann nicht verwendet werden. Nimm eine PNG-, JPG- oder WebP-Datei.', 'err'); }
}

  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  renderNav();
  renderMain();
  try { window.scrollTo(0, 0); } catch (e) {}
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const pick = e.target.closest('[data-play]');
  if (pick) {
    S.playId = pick.dataset.play;
    destroyBoards();
    $('#stage').innerHTML = stageHTML(currentPlay());
    mountStage();
    $$('.lib-item').forEach(x => x.setAttribute('aria-current', String(x.dataset.play === S.playId)));
    if (window.innerWidth < 980) { try { $('#stage').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); } catch (_) {} }
    return;
  }
  const cat = e.target.closest('[data-cat]');
  if (cat) { S.cat = cat.dataset.cat; $('#chips').innerHTML = chipsHTML(); $('#lib-list').innerHTML = libListHTML(); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, id = a.dataset.id;
  const d = S.draft;
  switch (act) {
    case 'goto-admin': S.adminTab = id || 'plays'; go('admin'); break;
    case 'tab': S.adminTab = id; S.pendingImg = undefined; renderMain(); break;
    case 'new-play': S.draft = newPlay(); S.frame = 0; S.dirty = false; renderAdminBody(); break;
    case 'edit-play': { const p = DATA.plays.find(x => x.id === id); if (p) { S.draft = clone(p); S.frame = 0; S.dirty = false; renderAdminBody(); } break; }
    case 'view-play': S.playId = id; go('plays'); break;
    case 'del-play': confirmClick(a, () => commit(n => { n.plays = n.plays.filter(p => p.id !== id); }, 'Play gelöscht')); break;
    case 'p-up': case 'p-down': moveItem('plays', id, act === 'p-up' ? -1 : 1, 'Reihenfolge gespeichert'); break;
    case 'r-up': case 'r-down': moveItem('roster', id, act === 'r-up' ? -1 : 1, 'Reihenfolge gespeichert'); break;
    case 'r-edit': S.editId.roster = id; S.pendingImg = undefined; renderAdminBody(); try { $('#f-roster').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 'r-cancel': S.editId.roster = null; S.pendingImg = undefined; renderAdminBody(); break;
    case 'r-del': confirmClick(a, () => commit(n => { n.roster = n.roster.filter(r => r.id !== id); }, 'Spieler entfernt')); break;
    case 'r-clear-img': { S.pendingImg = ''; const p = $('#fr-prev'); if (p) p.innerHTML = icon('user', 'ico big'); a.hidden = true; break; }
    case 's-edit': S.editId.scrim = id; renderAdminBody(); try { $('#f-scrim').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 's-cancel': S.editId.scrim = null; renderAdminBody(); break;
    case 's-del': confirmClick(a, () => commit(n => { n.scrims = n.scrims.filter(x => x.id !== id); }, 'Scrim gelöscht')); break;
    case 't-edit': S.editId.tour = id; renderAdminBody(); try { $('#f-tour').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 't-cancel': S.editId.tour = null; renderAdminBody(); break;
    case 't-del': confirmClick(a, () => commit(n => { n.tournaments = n.tournaments.filter(x => x.id !== id); }, 'Turnier gelöscht')); break;
    case 'ed-frame': if (!d) break; if (S.previewing) stopPreview(); S.frame = clamp(+id, 0, d.frames.length - 1); S.edBoard && S.edBoard.editFrame(S.frame); refreshEditorParts(); break;
    case 'ed-add': {
      if (!d) break;
      if (S.previewing) stopPreview();
      const cur = d.frames[S.frame];
      d.frames.splice(S.frame + 1, 0, { note: '', d: 1, curve: 0, pos: clone(cur.pos) });
      S.frame += 1; S.dirty = true;
      S.edBoard.setPlay(d); S.edBoard.editFrame(S.frame); refreshEditorParts();
      break;
    }
    case 'ed-del': {
      if (!d || S.frame === 0 || d.frames.length < 2) break;
      if (S.previewing) stopPreview();
      d.frames.splice(S.frame, 1);
      S.frame = Math.max(0, S.frame - 1); S.dirty = true;
      S.edBoard.setPlay(d); S.edBoard.editFrame(S.frame); refreshEditorParts();
      break;
    }
    case 'ed-preview': togglePreview(); break;
    case 'ed-save': saveDraft(); break;
    case 'ed-cancel':
      if (S.dirty) { if (!a.classList.contains('confirm')) { a.classList.add('confirm'); a.textContent = 'Änderungen verwerfen?'; setTimeout(() => { if (a.isConnected) { a.classList.remove('confirm'); a.innerHTML = icon('back') + ' Zur Liste'; } }, 3500); break; } }
      S.draft = null; S.dirty = false; renderAdminBody();
      break;
  }
});
document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  const fe = t.closest && t.closest('.field.err');
  if (fe) { fe.classList.remove('err'); const m = $('.err-msg', fe); if (m) m.hidden = true; }
  if (id === 'play-q') { S.q = t.value; const l = $('#lib-list'); if (l) l.innerHTML = libListHTML(); return; }
  const d = S.draft;
  if (!d || !t.closest('.editor')) return;
  const f = d.frames[S.frame];
  if (id === 'ed-name') { d.name = t.value; S.dirty = true; }
  else if (id === 'ed-desc') { d.desc = t.value; S.dirty = true; }
  else if (id === 'ed-note') { f.note = t.value; S.dirty = true; }
  else if (id === 'ed-dur') { const v = parseFloat(String(t.value).replace(',', '.')); if (isFinite(v)) { f.d = clamp(v, 0.2, 8); S.dirty = true; } }
  else if (id === 'ed-curve') {
    if (S.previewing) stopPreview();
    f.curve = clamp(+t.value, -1, 1);
    t.style.setProperty('--p', ((f.curve + 1) * 50) + '%');
    const o = $('#ed-curve-v'); if (o) o.textContent = fmtCurve(f.curve);
    S.dirty = true;
    if (S.edBoard) S.edBoard.refreshEdit();
  } else if (t.dataset.lab) {
    const pl = d.players.find(p => p.id === t.dataset.lab);
    if (pl) { pl.label = t.value.trim().slice(0, 3).toUpperCase() || '?'; if (S.edBoard) S.edBoard.setLabel(pl.id, pl.label); S.dirty = true; }
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = S.draft;
  if (!d) return;
  if (t.id === 'ed-cat') { d.cat = t.value; S.dirty = true; }
  if (t.id === 'ed-away') {
    if (S.previewing) stopPreview();
    setAwayCount(+t.value); S.dirty = true;
    if (S.edBoard) { S.edBoard.setPlay(d); S.edBoard.editFrame(S.frame); }
    const pp = $('#ed-players'); if (pp) pp.innerHTML = playersPanelHTML();
  }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'plays' || !S.stageBoard) return;
  if (e.target.closest && e.target.closest('input,textarea,select,button,a,[contenteditable]')) return;
  if (e.key === ' ') { e.preventDefault(); S.stageBoard.toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); S.stageBoard.step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); S.stageBoard.step(-1); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) go(h); });

/* ---------- capabilities ---------- */
async function initCaps() {
  const c = window.claude;
  let user = null, art = null;
  if (c && typeof c.use === 'function') {
    try { [user, art] = await Promise.all([c.use('user').catch(() => null), c.use('artifact').catch(() => null)]); } catch (e) {}
  }
  S.artifact = art || null;
  let can = false;
  if (user) { try { can = !!(await user.canEdit()); } catch (e) {} }
  S.canEdit = can && !!S.artifact;
  S.userKnown = true;
  renderNav();
  if (S.view === 'admin') renderMain();
}

/* ---------- boot ---------- */
function start(hotData) {
  renderShell();
  let bootToast = null;
  const raw = store.get('af-stash');
  if (raw) {
    store.del('af-stash');
    try {
      const st = JSON.parse(raw);
      if (st && Date.now() - st.at < 90000) {
        if (VIEWS.includes(st.view)) S.view = st.view;
        if (st.adminTab) S.adminTab = st.adminTab;
        if (st.playId) S.playId = st.playId;
        if (st.draft) { S.draft = normPlay(st.draft); S.frame = 0; S.dirty = true; S.adminTab = 'plays'; }
        if (st.toast) bootToast = [st.toast, st.kind || 'ok'];
      }
    } catch (e) {}
  } else {
    const h = (location.hash || '').slice(1);
    if (VIEWS.includes(h)) S.view = h;
    else if (hotData && VIEWS.includes(hotData.view)) { S.view = hotData.view; if (hotData.playId) S.playId = hotData.playId; if (hotData.adminTab) S.adminTab = hotData.adminTab; }
  }
  renderNav();
  renderMain();
  renderFooter();
  if (bootToast) toast(bootToast[0], bootToast[1]);
  initCaps();
}
try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: S.view, playId: S.playId, adminTab: S.adminTab })); } catch (e) {}
const HOT = window.claude && window.claude.hot;
let started = false;
const startOnce = d => { if (started) return; started = true; start(d && typeof d === 'object' ? d : {}); };
if (HOT && typeof HOT.ready === 'function') { try { HOT.ready(startOnce); } catch (e) {} setTimeout(() => startOnce({}), 1200); }
else startOnce((HOT && HOT.data) || {});
})();
</script>
</body></html>
