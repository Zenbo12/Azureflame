<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azure Flame</title>
<meta name="description" content="Azure Flame – Rematch 5v5 Team. Playbook, Roster, Scrim- und Turnier-Ergebnisse.">
<meta name="theme-color" content="#04070D">
<meta property="og:title" content="Azure Flame">
<meta property="og:description" content="Rematch 5v5 Team: Playbook, Roster, Scrims und Turniere.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky command bar over one centered stage (max 1240px). The tactics board is the hero; sections stack below on one rhythm; admin is a two-pane workbench. */
:root{
  --bg:#04070D;
  --surface:#0A1222;
  --surface-2:#0E192E;
  --well:#060B16;
  --line:#16233B;
  --line-2:#22365C;
  --fg:#E7EEF9;
  --muted:#8E9FBD;
  --dim:#5F7194;
  --azure:#2F8CFF;
  --azure-deep:#1A55C9;
  --flame:#7FD3FF;
  --core:#E6F6FF;
  --ink:#03101F;
  --opp:#9FB2D3;
  --win:#45D99A;
  --loss:#FF6079;
  --draw:#9DABC5;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
  --max:1240px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --tok-s:1;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#05080F}
::selection{background:rgba(47,140,255,.4);color:#fff}
.wrap{width:100%;max-width:calc(var(--max) + 64px);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;text-transform:uppercase}
p{margin:0}
a{color:var(--flame)}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dimtxt{color:var(--dim);font-size:13px}
.ico{width:18px;height:18px;flex:none}
.ico.sm{width:15px;height:15px}
.ico.big{width:30px;height:30px;color:var(--dim)}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--flame);display:inline-flex;align-items:center;gap:10px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--flame);box-shadow:0 0 12px var(--flame);animation:pulse 2.2s ease-in-out infinite}
.h-page{font-size:clamp(42px,6.4vw,76px)}
.lede{color:var(--muted);max-width:62ch;font-size:17px}
.only-edit{display:none!important}
.can-edit .only-edit{display:inline-flex!important}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(5,8,15,.86);-webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(47,140,255,.55) 30%,rgba(127,211,255,.8) 50%,rgba(47,140,255,.55) 70%,transparent);opacity:.55;pointer-events:none}
.topbar-in{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);background:none;border:0;padding:4px 0;cursor:pointer}
.brand-name{font-family:var(--display);font-weight:900;font-size:25px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand-name span{color:var(--flame)}
.logo-core{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.6s ease-in-out infinite}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{appearance:none;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:600 15px/1 var(--body);letter-spacing:.02em;padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav .nav-admin{color:var(--flame)}
@media (max-width:720px){.topbar-in{gap:6px;padding-block:10px 6px}.nav{margin-left:0;width:100%}.nav button{padding:9px 12px;font-size:14px}}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:700 15px/1 var(--body);letter-spacing:.02em;color:var(--ink);background:linear-gradient(180deg,var(--flame),var(--azure));box-shadow:0 8px 24px -10px rgba(47,140,255,.85),inset 0 1px 0 rgba(255,255,255,.45);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(47,140,255,.95),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(0)}
.btn.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--azure);background:rgba(47,140,255,.08)}
.btn.btn-sm{padding:8px 14px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:progress;transform:none}
.link-btn{appearance:none;background:none;border:0;color:var(--flame);font:600 14px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 0;text-decoration:none}
.link-btn:hover{color:var(--core)}
.mini{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--body);padding:8px 10px;border-radius:8px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line-2);transition:color .15s,background .15s;text-decoration:none}
.mini:hover{color:var(--fg);background:var(--surface-2)}
.mini[disabled]{opacity:.35;cursor:not-allowed}
.mini.danger{color:var(--loss)}
.mini.confirm{background:var(--loss);color:#1A0207;box-shadow:none}
.mini.icon{padding:7px}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:56px 40px;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(42% 60% at 78% 42%,rgba(47,140,255,.22),transparent 70%),radial-gradient(28% 40% at 6% 8%,rgba(127,211,255,.09),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
.hero-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(127,178,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(127,178,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(70% 80% at 60% 40%,#000,transparent);mask-image:radial-gradient(70% 80% at 60% 40%,#000,transparent)}
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--flame);box-shadow:0 0 10px 2px rgba(127,211,255,.7);opacity:0;animation:ember linear infinite}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.hero-title{font-size:clamp(68px,9.6vw,150px);font-weight:900;line-height:.84;letter-spacing:0;display:flex;flex-direction:column;margin-block:18px 26px}
.ht-b{background:linear-gradient(100deg,var(--azure-deep) 0%,var(--azure) 28%,var(--flame) 52%,var(--core) 62%,var(--flame) 72%,var(--azure) 92%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:burn 9s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px rgba(47,140,255,.35))}
.tagline{font-size:21px;color:var(--muted);max-width:30ch;font-weight:500;line-height:1.4}
.about{color:var(--muted);max-width:52ch;margin-top:14px}
.roles-line{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:4px}
.roles-line span{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:7px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);background:rgba(10,18,34,.6)}
.roles-line b{color:var(--flame);font-weight:700;margin-right:6px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-board{margin:0;min-width:0}
.board-cap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:15px}
.cap-k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}
.board-cap strong{color:var(--fg);font-weight:700}
.cap-note{min-width:0}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:28px}.hero{padding-block:34px 28px}}

.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:44px 0 0;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px;padding:18px 20px 0 0;min-width:0}
.stat+.stat{padding-left:22px;border-left:1px solid var(--line)}
.stat dt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat dd{margin:0}
.stat-v{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){margin-top:14px;border-top:1px solid var(--line)}.stat-v{font-size:36px}}

/* sections */
.page-head{padding-block:48px 26px;display:flex;flex-direction:column;gap:10px}
.sec-pad{padding-bottom:72px}
.band{padding-block:56px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.band-roster{padding-block:36px 72px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:36px;margin-top:6px}
@media (max-width:900px){.band{grid-template-columns:minmax(0,1fr);gap:40px}}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:30px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--muted);background:linear-gradient(180deg,rgba(14,25,46,.45),transparent)}
.empty h3{font-size:26px;color:var(--fg)}
.empty-sm{color:var(--dim);font-size:14px;padding:14px 0}

/* board */
.board-frame{position:relative;border-radius:22px;background:#03060C;box-shadow:0 0 0 1px var(--line-2),0 30px 80px -40px rgba(47,140,255,.65);overflow:hidden}
.board-host{width:100%;max-width:100%;aspect-ratio:1088/688}
.board-host svg{display:block;width:100%;height:100%}
.badge-step{position:absolute;left:14px;top:12px;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(4,8,16,.82);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--flame);pointer-events:none}
.pitch .tok-in{transform-box:fill-box;transform-origin:center;transform:scale(var(--tok-s))}
.pitch .tok-label{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;pointer-events:none;user-select:none}
.pitch .tok.h .tok-body{stroke:#D6EEFF;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(47,140,255,.55))}
.pitch .tok.a .tok-body{stroke:var(--opp);stroke-width:2.5}
.pitch .tok.h .tok-label{fill:var(--ink)}
.pitch .tok.a .tok-label{fill:#DCE6F5}
.pitch .tok-ring{fill:none;stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pitch .tok.h .tok-ring{stroke:var(--flame)}
.pitch .tok.a .tok-ring{stroke:#AFC0DC}
.pitch .tok.moving .tok-ring{animation:ring 1.1s ease-out infinite}
.pitch .run{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 9;animation:march 1.1s linear infinite}
.pitch .run.h{stroke:#5FB0FF}
.pitch .run.a{stroke:var(--opp);stroke-opacity:.7}
.pitch .pass{fill:none;stroke:var(--core);stroke-width:3.5;stroke-linecap:round}
.pitch .pass-glow{fill:none;stroke:var(--flame);stroke-width:13;stroke-linecap:round;stroke-opacity:.28;animation:glowp 1.6s ease-in-out infinite}
.pitch .dribble{fill:none;stroke:var(--core);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1 8;animation:march 1.1s linear infinite}
.pitch .l-arrows{transition:opacity .25s}
.pitch .l-arrows.is-hold{opacity:.6}
.pitch .ghost{fill:none;stroke-width:2.5;stroke-dasharray:4 5;pointer-events:none}
.pitch .ghost.h{stroke:#5FB0FF;stroke-opacity:.6}
.pitch .ghost.a{stroke:var(--opp);stroke-opacity:.45}
.pitch .ghost.b{stroke:var(--core);stroke-opacity:.6}
.pitch.editing{touch-action:none}
.pitch.editing .tok,.pitch.editing .ball{cursor:grab}
.pitch.editing .tok.drag,.pitch.editing .ball.drag{cursor:grabbing}
.pitch.editing .tok:focus,.pitch.editing .ball:focus{outline:none}
.pitch.editing .tok:focus-visible .tok-ring,.pitch.editing .tok.drag .tok-ring{opacity:1;animation:none}
.pitch.editing .ball:focus-visible .ball-core{stroke:var(--flame);stroke-width:4}
@media (max-width:600px){:root{--tok-s:1.3}}

/* role chips */
.role-chips{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.rchip{font:700 10.5px/1 var(--mono);letter-spacing:.06em;padding:5px 6px;border-radius:5px}
.rchip.h{color:var(--ink);background:linear-gradient(180deg,var(--flame),var(--azure))}
.rchip.a{color:#DCE6F5;box-shadow:inset 0 0 0 1px #5C6E90;background:#121B2C}

/* playbook */
.plays-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-bottom:72px}
.stage{min-width:0}
.stage-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.stage-head h3{font-size:clamp(32px,4.2vw,48px)}
.stage-head .desc{color:var(--muted);max-width:68ch}
.stage-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:6px;color:var(--flame);background:rgba(127,211,255,.08);box-shadow:inset 0 0 0 1px rgba(127,211,255,.24)}
.stage-cap{display:flex;gap:12px;align-items:baseline;margin-top:14px;min-height:28px;font-size:16px}
.stage-cap .cap-note{color:var(--fg)}
.controls{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn{appearance:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,transform .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.main{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,var(--flame),var(--azure));color:var(--ink);box-shadow:0 6px 20px -8px rgba(47,140,255,.9)}
.icon-btn.main:hover{transform:scale(1.05)}
.scrub{position:relative;flex:1 1 200px;min-width:150px;height:36px;display:flex;align-items:center}
.scrub input{width:100%}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none}
.ticks i{position:absolute;top:-6px;width:2px;height:12px;background:var(--surface);border-radius:2px;transform:translateX(-1px)}
.time{font-size:12.5px;color:var(--muted);min-width:92px;text-align:right}
.ctl-group{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 12px/1 var(--mono);padding:7px 9px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--flame);box-shadow:inset 0 0 0 1px var(--line-2)}
.toggle{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--muted);cursor:pointer;text-transform:none;letter-spacing:0}
.toggle input{accent-color:var(--azure);width:16px;height:16px;margin:0}
.legend{list-style:none;margin:14px 0 0;padding:0;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend li{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.lg-h{background:var(--azure);box-shadow:0 0 0 2px #D6EEFF inset}
.lg-a{background:#121B2C;box-shadow:0 0 0 2px var(--opp) inset}
.legend .lg-b{width:22px;height:3px;border-radius:2px;background:var(--core);box-shadow:0 0 8px var(--flame)}
.legend .lg-r{width:22px;height:0;border-radius:0;border-top:3px dashed #5FB0FF}
.role-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--dim)}
.role-key b{font:700 11.5px var(--mono);color:var(--flame);margin-right:5px}
.role-key .a b{color:var(--opp)}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:4px}
.steps button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:baseline;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font:500 15px/1.45 var(--body);transition:background .2s,color .2s}
.steps button:hover{background:var(--surface);color:var(--fg)}
.steps .n{font:700 13px var(--mono);color:var(--dim)}
.steps li.on button{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.steps li.on .n{color:var(--flame)}
.library{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 108px);display:flex;flex-direction:column;gap:14px;min-width:0}
.lib-tools{display:flex;flex-direction:column;gap:10px}
.lib-list{list-style:none;margin:0;padding:2px 4px 2px 2px;overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.lib-item{width:100%;display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:10px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);cursor:pointer;transition:box-shadow .2s,background .2s,transform .25s var(--ease)}
.lib-item:hover{box-shadow:inset 0 0 0 1px var(--line-2);transform:translateX(2px)}
.lib-item[aria-current="true"]{background:linear-gradient(90deg,rgba(47,140,255,.16),var(--surface) 75%);box-shadow:inset 0 0 0 1.5px var(--azure)}
.lib-thumb{display:block;border-radius:8px;overflow:hidden;background:var(--well)}
.lib-thumb svg,.adm-thumb svg{display:block;width:100%;height:auto}
.lib-meta{min-width:0;display:flex;flex-direction:column;gap:5px}
.lib-cat{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--flame)}
.lib-name{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.lib-sub{display:block;font-size:12.5px;color:var(--dim)}
@media (max-width:980px){.plays-layout{grid-template-columns:minmax(0,1fr)}.library{position:static;max-height:none}.lib-list{overflow:visible;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}

/* chips + inputs */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);font:600 12.5px/1 var(--body);padding:8px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--azure);color:var(--ink);box-shadow:none}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;min-width:0;background:var(--well);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font:500 15px/1.35 var(--body);transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px rgba(47,140,255,.22)}
input[disabled]{opacity:.45}
textarea{resize:vertical;min-height:88px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--azure) var(--p,0%),var(--line-2) var(--p,0%));margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--core);box-shadow:0 0 0 4px rgba(47,140,255,.35),0 0 14px rgba(127,211,255,.8)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--core);box-shadow:0 0 0 4px rgba(47,140,255,.35),0 0 14px rgba(127,211,255,.8)}
input[type=range]::-moz-range-track{background:transparent}
input[type=range]:focus{box-shadow:none}
input[type=range]:focus-visible{outline:2px solid var(--flame);outline-offset:6px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.field>.lbl{font:600 11.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.opt{font-weight:500;color:var(--dim);text-transform:none;letter-spacing:0;font-family:var(--body);font-size:12px}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field.err input,.field.err textarea,.field.err select{border-color:var(--loss)}
.err-msg{color:var(--loss);font-size:13px}
.hint{font-size:13.5px;color:var(--dim)}

/* roster */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.pcard{display:flex;flex-direction:column;border-radius:var(--r);background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s}
.pcard:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line-2),0 26px 50px -28px rgba(47,140,255,.75)}
.pcard-img{position:relative;aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 35%,rgba(47,140,255,.22),transparent 70%),var(--well);padding:14px}
.pcard-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));transition:transform .5s var(--ease)}
.pcard:hover .pcard-img img{transform:scale(1.035)}
.pcard-code{position:absolute;right:14px;bottom:10px;font:900 46px/1 var(--display);letter-spacing:.03em;color:transparent;-webkit-text-stroke:1px rgba(127,211,255,.45);pointer-events:none}
.pcard-body.has-code{position:relative;padding-right:78px}
.pc-ph{width:72%;aspect-ratio:3/4;max-width:100%;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#10203D,#070D19);box-shadow:inset 0 0 0 1px var(--line-2)}
.pc-ph span{font:900 54px/1 var(--display);color:rgba(127,211,255,.28)}
.pcard-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.pos-tag{align-self:flex-start;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--flame);background:rgba(127,211,255,.08);box-shadow:inset 0 0 0 1px rgba(127,211,255,.25);padding:5px 8px;border-radius:6px}
.pcard-name{font-size:28px;overflow-wrap:anywhere}
.pcard-role{font-size:13.5px;color:var(--muted)}

/* results */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);margin:0 0 28px;overflow:hidden}
.sum{padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sum+.sum{border-left:1px solid var(--line)}
.sum dt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sum dd{margin:0}
.sum-v{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.sum-v i{font-style:normal;color:var(--dim);margin:0 3px}
.sum-v small{font-size:24px;color:var(--muted);margin-left:2px}
.sum-sub{font-size:13px;color:var(--muted)}
.form{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.form span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono)}
.f-w{color:var(--win);background:rgba(69,217,154,.12);box-shadow:inset 0 0 0 1px rgba(69,217,154,.4)}
.f-l{color:var(--loss);background:rgba(255,96,121,.12);box-shadow:inset 0 0 0 1px rgba(255,96,121,.4)}
.f-d{color:var(--draw);background:rgba(157,171,197,.1);box-shadow:inset 0 0 0 1px rgba(157,171,197,.35)}
@media (max-width:760px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.sum:nth-child(3){border-left:0}.sum:nth-child(n+3){border-top:1px solid var(--line)}.sum-v{font-size:34px}}
.results{list-style:none;margin:0;padding:0}
.res-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;align-items:center;gap:6px 18px;padding:14px 4px;border-bottom:1px solid var(--line);transition:background .2s}
.res-row:hover{background:linear-gradient(90deg,transparent,rgba(47,140,255,.05) 40%,transparent)}
.res-row:first-child{border-top:1px solid var(--line)}
.res-date{color:var(--dim);font-size:13px}
.res-teams{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;min-width:0;font-size:17px;font-weight:600}
.res-us{color:var(--flame);font-weight:700;white-space:nowrap}
.res-vs{font:600 11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.res-opp{color:var(--fg);min-width:0;overflow-wrap:anywhere}
.res-scorebox{display:flex;align-items:center;gap:10px;justify-self:end}
.res-score{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.res-score i{font-style:normal;color:var(--dim);margin:0 4px}
.res-score b:last-of-type{color:var(--muted)}
.bo{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:6px;padding:5px 7px;white-space:nowrap}
.res-chip{justify-self:end;font:700 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;text-align:center;min-width:88px}
.res-note{grid-column:2 / -1;color:var(--muted);font-size:14px}
.half .res-row{grid-template-columns:minmax(0,1fr) auto auto}
.half .res-date{grid-column:1 / -1;grid-row:1}
.half .res-note{grid-column:1 / -1}
@media (max-width:640px){.res-row,.half .res-row{grid-template-columns:minmax(0,1fr) auto}.res-date,.half .res-date{grid-row:1;grid-column:1}.res-chip{grid-row:1;grid-column:2;min-width:0}.res-teams{grid-row:2;grid-column:1}.res-scorebox{grid-row:2;grid-column:2}.res-score{font-size:28px}.res-note,.half .res-note{grid-row:3;grid-column:1 / -1}}
.tours{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.tour{display:grid;grid-template-columns:104px minmax(0,1fr);gap:22px;align-items:center;padding:18px 22px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s}
.tour:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.tour-place{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line-2)}
.tour-place .num{font-family:var(--display);font-weight:900;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.tour-place .lbl{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.tour.p1 .tour-place{background:radial-gradient(80% 80% at 50% 30%,rgba(127,211,255,.35),rgba(47,140,255,.12) 60%,var(--well));box-shadow:inset 0 0 0 1px rgba(127,211,255,.6),0 0 40px -10px rgba(127,211,255,.6)}
.tour.p1 .num{color:var(--core);text-shadow:0 0 24px rgba(127,211,255,.85)}
.tour.p2 .num,.tour.p3 .num{color:var(--flame)}
.tour-body{min-width:0}
.tour h3{font-size:28px;overflow-wrap:anywhere}
.tour .meta{color:var(--muted);font-size:13px;margin-top:6px}
.tour .note{margin-top:8px;color:#C9D5EA}
.tour .link-btn{margin-top:6px}
.tours.compact .tour{grid-template-columns:72px minmax(0,1fr);padding:14px 16px;gap:16px}
.tours.compact .tour-place .num{font-size:34px}
.tours.compact h3{font-size:22px}
@media (max-width:560px){.tour{grid-template-columns:76px minmax(0,1fr);gap:14px;padding:14px}.tour-place .num{font-size:34px}.tour h3{font-size:23px}}

/* admin */
.adm-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:18px;font-size:14px;color:var(--muted)}
.adm-bar b{color:var(--fg)}
.adm-bar .sp{flex:1}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 10px var(--win)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.tabs button{appearance:none;display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:700 15px var(--body);padding:12px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--azure)}
.tab-n{font:600 11px var(--mono);color:var(--dim);background:var(--surface);border-radius:999px;padding:3px 7px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:22px}
.adm-split{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:72px}
.adm-form{display:flex;flex-direction:column;gap:16px}
.adm-form h3,.adm-head h3{font-size:26px}
.adm-form>p{color:var(--muted);font-size:14.5px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.adm-listwrap{min-width:0}
.adm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.adm-head p{color:var(--muted);font-size:14px;margin-top:6px}
.adm-list{list-style:none;margin:0;padding:0}
.adm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.adm-row:first-child{border-top:1px solid var(--line)}
.adm-thumb{width:96px;border-radius:8px;overflow:hidden;background:var(--well);display:block}
.adm-thumb.portrait{width:48px;aspect-ratio:3/4;display:grid;place-items:center}
.adm-thumb img{width:100%;height:100%;object-fit:contain}
.adm-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.adm-main b{font-weight:700;overflow-wrap:anywhere}
.adm-main>span{font-size:13px;color:var(--dim)}
.adm-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm-score{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:66px;padding:8px;border-radius:8px}
.adm-score b{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.adm-score small{font:600 10px/1 var(--mono);letter-spacing:.06em;opacity:.85}
.adm-place{font:900 26px/1 var(--display);min-width:52px;text-align:center;color:var(--flame)}
@media (max-width:900px){.adm-split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.adm-row{grid-template-columns:auto minmax(0,1fr)}.adm-actions{grid-column:1 / -1;justify-content:flex-start}}
.drop{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:12px;border:1.5px dashed var(--line-2);background:var(--well);cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--azure);background:rgba(47,140,255,.08)}
.drop:focus-within{outline:2px solid var(--flame);outline-offset:2px}
.drop .prev{width:64px;aspect-ratio:3/4;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.drop .prev img{width:100%;height:100%;object-fit:contain}
.drop-txt{font-size:13.5px;color:var(--muted);line-height:1.4}
.drop-txt b{color:var(--fg)}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.score-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.score-in input{font:800 26px/1 var(--display);text-align:center;padding:10px 8px}
.score-sep{font:800 30px/1 var(--display);color:var(--dim);padding-bottom:12px}
.links-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
.login-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:72px}
.howto{display:flex;flex-direction:column;gap:22px;min-width:0}
.howto h3{font-size:24px}
.howto h4{font:700 15px var(--body);text-transform:none;letter-spacing:0;color:var(--fg);margin-bottom:8px}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted);font-size:14.5px}
.howto ol b{color:var(--fg);font-weight:600}
.howto .note{color:var(--dim);font-size:13.5px;margin-top:8px}
.howto section{padding:18px 20px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.kbd{font:600 12.5px var(--mono);color:var(--flame);background:var(--well);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:6px;padding:1px 6px;white-space:nowrap}
@media (max-width:900px){.login-grid{grid-template-columns:minmax(0,1fr)}}

/* editor */
.editor{display:flex;flex-direction:column;gap:18px;padding-bottom:72px}
.ed-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ed-top h3{font-size:30px;margin-right:auto}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.ed-stage{min-width:0}
.ed-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-side .panel{display:flex;flex-direction:column;gap:14px}
.step-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.step-pill{appearance:none;border:0;min-width:40px;height:36px;padding:0 10px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted);font:700 14px var(--mono);cursor:pointer;transition:background .2s,color .2s}
.step-pill:hover{color:var(--fg)}
.step-pill.on{background:var(--azure);color:var(--ink);box-shadow:none}
.strip-sep{flex:1}
.ed-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;margin-top:14px;align-items:end}
.ed-fields output{color:var(--flame);font-family:var(--mono);text-transform:none;letter-spacing:0}
.ed-fields input[type=range]{margin-block:15px}
.pick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pick{appearance:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 3px 9px;border-radius:10px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--dim);cursor:pointer;transition:background .2s,box-shadow .2s,color .2s,transform .2s var(--ease);min-width:0}
.pick:hover{color:var(--muted);transform:translateY(-1px)}
.pick b{font:800 18px/1 var(--display);letter-spacing:.03em}
.pick span{font-size:10px;line-height:1.15;text-align:center;font-weight:600}
.pick.h[aria-pressed="true"]{background:linear-gradient(180deg,rgba(127,211,255,.22),rgba(47,140,255,.16));box-shadow:inset 0 0 0 1.5px var(--azure),0 6px 18px -10px rgba(47,140,255,.9);color:var(--fg)}
.pick.h[aria-pressed="true"] b{color:var(--flame)}
.pick.a[aria-pressed="true"]{background:rgba(159,178,211,.12);box-shadow:inset 0 0 0 1.5px var(--opp);color:var(--fg)}
.pick-quick{display:flex;gap:6px;flex-wrap:wrap}
.ed-help{font-size:13.5px;color:var(--muted);display:grid;gap:6px;padding-left:18px;margin:0}
@media (max-width:1060px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.ed-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.ed-fields .f-note{grid-column:1 / -1}}

/* footer, toasts, veil */
.foot{border-top:1px solid var(--line);padding-block:28px;color:var(--dim);font-size:14px}
.foot-in{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot-brand{display:flex;align-items:center;gap:10px;font:800 18px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot-links{display:flex;gap:16px;flex-wrap:wrap}
.foot a{color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.foot a:hover{color:var(--flame)}
.foot-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.foot-admin{appearance:none;background:none;border:0;color:var(--dim);font:600 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 0}
.foot-admin:hover{color:var(--flame)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100% - 32px)}
.toast{pointer-events:auto;background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2),0 20px 40px -20px #000;border-radius:12px;padding:12px 16px;font-size:14.5px;max-width:440px;animation:toastIn .35s var(--ease) both;transition:opacity .35s,transform .35s}
.toast.ok{box-shadow:inset 0 0 0 1px rgba(69,217,154,.5),0 20px 40px -20px #000}
.toast.err{box-shadow:inset 0 0 0 1px rgba(255,96,121,.55),0 20px 40px -20px #000}
.toast.out{opacity:0;transform:translateY(6px)}
.veil{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,6,12,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.veil-box{display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:600}
.veil-box .logo{animation:bob 1.2s ease-in-out infinite}

/* motion */
.view{animation:rise .5s var(--ease) both}
.rise{animation:rise .7s var(--ease) both}
.d2{animation-delay:.08s}.d3{animation-delay:.16s}
@keyframes rise{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes burn{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-3%,2%,0) scale(1.06)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flicker{0%,100%{transform:scaleY(1)}35%{transform:scaleY(.9)}60%{transform:scaleY(1.06)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes ring{from{transform:scale(.9);opacity:.75}to{transform:scale(1.32);opacity:0}}
@keyframes glowp{0%,100%{stroke-opacity:.2}50%{stroke-opacity:.42}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- toasts, veil ---------- */
function toast(msg, kind) {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, kind === 'err' ? 7000 : 3800);
}
function veil(on) { const v = $('#veil'); if (v) v.hidden = !on; }

/* ---------- saving to GitHub ---------- */
async function commit(mutate, okMsg, opts) {
  opts = opts || {};
  if (S.saving) return false;
  if (!S.canEdit || !S.token) { toast(ERR.login, 'err'); return false; }
  S.saving = true;
  veil(true);
  try {
    if (opts.upload) await putFile(opts.upload.path, opts.upload.b64, 'Website: Playercard hochgeladen');
    let next;
    for (let attempt = 0; ; attempt++) {
      next = normalize(clone(DATA));
      mutate(next);
      const body = { message: 'Website: ' + okMsg, content: b64enc(serialize(next)), branch: GH.branch };
      if (S.sha) body.sha = S.sha;
      try {
        const r = await gh(contentsPath(GH.dataPath), { method: 'PUT', body });
        S.sha = (r && r.content && r.content.sha) || null;
        break;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt === 0) { await loadRemote(); continue; }
        throw e;
      }
    }
    DATA = normalize(JSON.parse(serialize(next)));
    if (opts.after) opts.after();
    (opts.cleanup || []).forEach(p => { deleteFile(p); });
    S.saving = false;
    veil(false);
    renderAll();
    toast(okMsg + '. Besucher sehen es in etwa einer Minute.', 'ok');
    return true;
  } catch (e) {
    S.saving = false;
    veil(false);
    if (e.status === 401) { logout(); renderAll(); toast(ERR.badtoken, 'err'); return false; }
    toast(saveErr(e), 'err');
    return false;
  }
}
function moveItem(key, id, dir, msg) {
  commit(n => { const a = n[key], i = a.findIndex(x => x.id === id), j = i + dir; if (i < 0 || j < 0 || j >= a.length) return; const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }, msg);
}
function confirmClick(btn, fn) {
  if (btn.classList.contains('confirm')) { clearTimeout(btn._t); fn(); return; }
  btn.classList.add('confirm');
  btn._orig = btn.innerHTML;
  btn.textContent = 'Wirklich löschen?';
  btn._t = setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirm'); btn.innerHTML = btn._orig; } }, 3500);
}
function markErr(fid, msg) {
  const f = document.getElementById(fid);
  if (!f) return;
  f.classList.add('err');
  const m = $('.err-msg', f);
  if (m) { if (msg) m.textContent = msg; m.hidden = false; }
  const i = $('input,textarea,select', f);
  if (i) i.focus();
}

/* ---------- images ---------- */
async function processImage(file) {
  if (!file || !/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) throw new Error('type');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let q = 0.88, out = c.toDataURL('image/webp', q);
    if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
    while (out.startsWith('data:image/webp') && out.length > 700000 && q > 0.45) { q -= 0.12; out = c.toDataURL('image/webp', q); }
    if (out.length > 1400000) out = c.toDataURL('image/jpeg', 0.8);
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function handleImg(file) {
  try {
    const data = await processImage(file);
    S.pendingImg = data;
    const prev = $('#fr-prev'), clr = $('#fr-clear');
    if (prev) prev.innerHTML = `<img src="${data}" alt="Vorschau der Playercard">`;
    if (clr) clr.hidden = false;
  } catch (e) { toast('Dieses Bild kann nicht verwendet werden. Nimm eine PNG-, JPG- oder WebP-Datei.', 'err'); }
}
const slug = s => String(s || 'spieler').toLowerCase().normalize('NFKD').replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'spieler';

  });
  const fr = $('#f-roster');
  if (fr) {
    const drop = $('#fr-drop'), inp = $('#fr-img');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleImg(f); });
    inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; if (f) handleImg(f); inp.value = ''; });
    fr.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#fr-name').value.trim();
      if (!name) return markErr('fr-name-f');
      const id = S.editId.roster, prev = id ? DATA.roster.find(r => r.id === id) : null;
      const entry = { id: id || uid(), name, pos: $('#fr-pos').value, role: $('#fr-role').value.trim(), img: (prev && prev.img) || '' };
      let upload = null;
      const cleanup = [];
      if (S.pendingImg !== undefined) {
        if (prev && isPathImg(prev.img)) cleanup.push(prev.img);
        if (isDataImg(S.pendingImg)) {
          const m = /^data:image\/(png|jpe?g|webp|gif);base64,(.*)$/.exec(S.pendingImg);
          const ext = m[1] === 'jpeg' ? 'jpg' : m[1];
          const path = `${GH.imgDir}/${slug(name)}-${Date.now().toString(36)}.${ext}`;
          IMG_CACHE[path] = S.pendingImg;
          upload = { path, b64: m[2] };
          entry.img = path;
        } else entry.img = '';
      }
      commit(n => { const i = n.roster.findIndex(r => r.id === entry.id); if (i >= 0) n.roster[i] = entry; else n.roster.push(entry); }, id ? 'Spieler aktualisiert' : `${name} ist jetzt im Roster`, { upload, cleanup, after: () => { S.editId.roster = null; S.pendingImg = undefined; } });
    });
  }
  const fs = $('#f-scrim');
  if (fs) fs.addEventListener('submit', e => {
    e.preventDefault();
    const opp = $('#fs-opp').value.trim(), fmt = $('#fs-fmt').value, us = toInt($('#fs-us').value, 0, 9), them = toInt($('#fs-them').value, 0, 9), n = boN(fmt);
    if (!opp) return markErr('fs-opp-f');
    if (n && us + them > n) return markErr('fs-score-f', `In einem ${fmt} gibt es höchstens ${n} Spiele.`);
    const id = S.editId.scrim;
    const entry = { id: id || uid(), date: $('#fs-date').value || todayISO(), opp, us, them, fmt, note: $('#fs-note').value.trim() };
    commit(m => { const i = m.scrims.findIndex(x => x.id === entry.id); if (i >= 0) m.scrims[i] = entry; else m.scrims.push(entry); }, id ? 'Scrim aktualisiert' : 'Scrim-Ergebnis gespeichert', { after: () => { S.editId.scrim = null; } });
  });
  const ft = $('#f-tour');
  if (ft) ft.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#ft-name').value.trim(), place = parseInt($('#ft-place').value, 10), rawLink = $('#ft-link').value.trim(), link = rawLink ? safeUrl(rawLink) : '';
    if (!name) return markErr('ft-name-f');
    if (!(place >= 1)) return markErr('ft-place-f');
    if (rawLink && !link) return markErr('ft-link-f');
    const id = S.editId.tour, teams = parseInt($('#ft-teams').value, 10);
    const entry = { id: id || uid(), name, date: $('#ft-date').value || todayISO(), place: clamp(place, 1, 512), teams: teams >= 2 ? teams : '', note: $('#ft-note').value.trim(), link };
    commit(m => { const i = m.tournaments.findIndex(x => x.id === entry.id); if (i >= 0) m.tournaments[i] = entry; else m.tournaments.push(entry); }, id ? 'Turnier aktualisiert' : 'Turnier gespeichert', { after: () => { S.editId.tour = null; } });
  });
  const tt = $('#f-team');
  if (tt) tt.addEventListener('submit', e => {
    e.preventDefault();
    const links = [0, 1, 2].map(i => ({ label: $(`#tl-${i}-label`).value.trim(), url: safeUrl($(`#tl-${i}-url`).value) })).filter(l => l.url);
    const tagline = $('#tt-tag').value.trim(), about = $('#tt-about').value.trim();
    commit(m => { m.team.tagline = tagline; m.team.about = about; m.team.links = links; }, 'Team-Infos gespeichert');
  });
}
function saveDraft() {
  if (S.previewing) stopPreview();
  const d = S.draft, name = d.name.trim();
  if (!name) { markErr('fld-name'); return; }
  const out = compactPlay(d);
  commit(n => { const i = n.plays.findIndex(p => p.id === out.id); const np = normPlay(out); if (i >= 0) n.plays[i] = np; else n.plays.unshift(np); }, `Play „${name}“ gespeichert`, { after: () => { S.draft = null; S.dirty = false; } });
}

/* ---------- navigation + events ---------- */
function go(v) {
  if (!VIEWS.includes(v)) v = 'home';
  S.view = v;
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  renderNav();
  renderMain();
  renderFooter();
  try { window.scrollTo(0, 0); } catch (e) {}
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const pick = e.target.closest('[data-play]');
  if (pick) {
    S.playId = pick.dataset.play;
    destroyBoards();
    $('#stage').innerHTML = stageHTML(currentPlay());
    mountStage();
    $$('.lib-item').forEach(x => x.setAttribute('aria-current', String(x.dataset.play === S.playId)));
    if (window.innerWidth < 980) { try { $('#stage').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); } catch (_) {} }
    return;
  }
  const cat = e.target.closest('[data-cat]');
  if (cat) { S.cat = cat.dataset.cat; $('#chips').innerHTML = chipsHTML(); $('#lib-list').innerHTML = libListHTML(); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, id = a.dataset.id;
  const d = S.draft;
  switch (act) {
    case 'goto-admin': S.adminTab = id || 'plays'; go('admin'); break;
    case 'logout': logout(); renderAll(); toast('Abgemeldet', 'ok'); break;
    case 'tab': S.adminTab = id; S.pendingImg = undefined; renderMain(); break;
    case 'new-play': S.draft = newPlay(); S.frame = 0; S.dirty = false; renderAdminBody(); break;
    case 'edit-play': { const p = DATA.plays.find(x => x.id === id); if (p) { S.draft = clone(p); S.frame = 0; S.dirty = false; renderAdminBody(); } break; }
    case 'view-play': S.playId = id; go('plays'); break;
    case 'del-play': confirmClick(a, () => commit(n => { n.plays = n.plays.filter(p => p.id !== id); }, 'Play gelöscht')); break;
    case 'p-up': case 'p-down': moveItem('plays', id, act === 'p-up' ? -1 : 1, 'Reihenfolge gespeichert'); break;
    case 'r-up': case 'r-down': moveItem('roster', id, act === 'r-up' ? -1 : 1, 'Reihenfolge gespeichert'); break;
    case 'r-edit': S.editId.roster = id; S.pendingImg = undefined; renderAdminBody(); try { $('#f-roster').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 'r-cancel': S.editId.roster = null; S.pendingImg = undefined; renderAdminBody(); break;
    case 'r-del': { const r = DATA.roster.find(x => x.id === id); confirmClick(a, () => commit(n => { n.roster = n.roster.filter(x => x.id !== id); }, 'Spieler entfernt', { cleanup: r && isPathImg(r.img) ? [r.img] : [] })); break; }
    case 'r-clear-img': { S.pendingImg = ''; const p = $('#fr-prev'); if (p) p.innerHTML = icon('user', 'ico big'); a.hidden = true; break; }
    case 's-edit': S.editId.scrim = id; renderAdminBody(); try { $('#f-scrim').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 's-cancel': S.editId.scrim = null; renderAdminBody(); break;
    case 's-del': confirmClick(a, () => commit(n => { n.scrims = n.scrims.filter(x => x.id !== id); }, 'Scrim gelöscht')); break;
    case 't-edit': S.editId.tour = id; renderAdminBody(); try { $('#f-tour').scrollIntoView({ block: 'start' }); } catch (_) {} break;
    case 't-cancel': S.editId.tour = null; renderAdminBody(); break;
    case 't-del': confirmClick(a, () => commit(n => { n.tournaments = n.tournaments.filter(x => x.id !== id); }, 'Turnier gelöscht')); break;
    case 'ed-pick': {
      if (!d) break;
      if (S.previewing) stopPreview();
      setPlayers(d.players.includes(id) ? d.players.filter(x => x !== id) : d.players.concat(id));
      refreshPlayers();
      break;
    }
    case 'ed-set': {
      if (!d) break;
      if (S.previewing) stopPreview();
      const opp = d.players.filter(x => sideOf(x) === 'a');
      if (id === 'attack') setPlayers(['mid', 'ss', 'st'].concat(opp));
      else if (id === 'home') setPlayers(HOME_IDS.concat(opp));
      else if (id === 'none-opp') setPlayers(d.players.filter(x => sideOf(x) === 'h'));
      refreshPlayers();
      break;
    }
    case 'ed-frame': if (!d) break; if (S.previewing) stopPreview(); S.frame = clamp(+id, 0, d.frames.length - 1); S.edBoard && S.edBoard.editFrame(S.frame); refreshEditorParts(); break;
    case 'ed-add': {
      if (!d) break;
      if (S.previewing) stopPreview();
      const cur = d.frames[S.frame];
      d.frames.splice(S.frame + 1, 0, { note: '', d: 1, curve: 0, pos: clone(cur.pos) });
      S.frame += 1; S.dirty = true;
      S.edBoard.setPlay(d); S.edBoard.editFrame(S.frame); refreshEditorParts();
      break;
    }
    case 'ed-del': {
      if (!d || S.frame === 0 || d.frames.length < 2) break;
      if (S.previewing) stopPreview();
      d.frames.splice(S.frame, 1);
      S.frame = Math.max(0, S.frame - 1); S.dirty = true;
      S.edBoard.setPlay(d); S.edBoard.editFrame(S.frame); refreshEditorParts();
      break;
    }
    case 'ed-preview': togglePreview(); break;
    case 'ed-save': saveDraft(); break;
    case 'ed-cancel':
      if (S.dirty && !a.classList.contains('confirm')) { a.classList.add('confirm'); a.textContent = 'Änderungen verwerfen?'; setTimeout(() => { if (a.isConnected) { a.classList.remove('confirm'); a.innerHTML = icon('back') + ' Zur Liste'; } }, 3500); break; }
      S.draft = null; S.dirty = false; renderAdminBody();
      break;
  }
});
document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  const fe = t.closest && t.closest('.field.err');
  if (fe) { fe.classList.remove('err'); const m = $('.err-msg', fe); if (m) m.hidden = true; }
  if (id === 'play-q') { S.q = t.value; const l = $('#lib-list'); if (l) l.innerHTML = libListHTML(); return; }
  const d = S.draft;
  if (!d || !t.closest('.editor')) return;
  const f = d.frames[S.frame];
  if (id === 'ed-name') { d.name = t.value; S.dirty = true; }
  else if (id === 'ed-desc') { d.desc = t.value; S.dirty = true; }
  else if (id === 'ed-note') { f.note = t.value; S.dirty = true; }
  else if (id === 'ed-dur') { const v = parseFloat(String(t.value).replace(',', '.')); if (isFinite(v)) { f.d = clamp(v, 0.2, 8); S.dirty = true; } }
  else if (id === 'ed-curve') {
    if (S.previewing) stopPreview();
    f.curve = clamp(+t.value, -1, 1);
    t.style.setProperty('--p', ((f.curve + 1) * 50) + '%');
    const o = $('#ed-curve-v'); if (o) o.textContent = fmtCurve(f.curve);
    S.dirty = true;
    if (S.edBoard) S.edBoard.refreshEdit();
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = S.draft;
  if (d && t.id === 'ed-cat') { d.cat = t.value; S.dirty = true; }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'plays' || !S.stageBoard) return;
  if (e.target.closest && e.target.closest('input,textarea,select,button,a,[contenteditable]')) return;
  if (e.key === ' ') { e.preventDefault(); S.stageBoard.toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); S.stageBoard.step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); S.stageBoard.step(-1); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) go(h); });
window.addEventListener('beforeunload', e => { if ((S.draft && S.dirty) || S.saving) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
async function fetchPublic() {
  try {
    const r = await fetch(GH.dataPath + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    return normalize(await r.json());
  } catch (e) { return null; }
}
async function boot() {
  renderShell();
  const h = (location.hash || '').slice(1);
  if (VIEWS.includes(h)) S.view = h;
  const tok = readToken();
  if (tok) S.loggingIn = true;
  const pub = fetchPublic();
  const first = await Promise.race([pub, sleep(1500).then(() => undefined)]);
  if (first) DATA = first;
  renderAll();
  if (first === undefined) pub.then(dd => { if (dd && !S.canEdit && !S.draft) { DATA = dd; renderAll(); } });
  if (tok) {
    try { await login(tok.value, tok.remember); }
    catch (e) { S.token = ''; if (e.status === 401 || e.nopush) clearToken(); }
    S.loggingIn = false;
    if (!S.draft) renderAll();
  }
}
boot();
})();
</script>
